# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  campusfootballapi:
    image: campusfootballapi
    build:
      context: .
      dockerfile: backend/CampusFootball.Api/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
    ports:
      - 8080:8080
    networks:
      - dev-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_HOST}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    #Enables data persistance independently of containers, in a docker-managed storage location
    #volumes:
    #  - postgres_data:/var/lib/postgresql
    networks:
      - dev-network

#volumes:
#  postgres_data:

 # Private user-defined bridge network - internal (container-to-container). Connection strings remain stable with Docker DNS (IP).  No ports exposed to host, Postgress not accessible from host machine. 
networks:
  dev-network:
    driver: bridge